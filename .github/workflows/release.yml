name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION_CODE=$(grep 'versionCode' app/build.gradle | head -1 | sed 's/[^0-9]//g')
          VERSION_NAME=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME}"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs (stable filenames)
        run: ./gradlew assembleTvRelease assembleMobileRelease -PstableApkName=true --no-daemon --stacktrace

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/tv/release/*.apk release-assets/
          cp app/build/outputs/apk/mobile/release/*.apk release-assets/
          ls -lh release-assets/

      - name: Generate update.json
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.versionName }}"
          CODE="${{ steps.version.outputs.versionCode }}"
          REPO="${{ github.repository }}"
          cat > release-assets/update.json <<EOF
          {
            "versionCode": ${CODE},
            "versionName": "${VERSION}",
            "apkUrl": "https://github.com/${REPO}/releases/download/${TAG}/FNTV_tv_release_v${VERSION}.apk",
            "apkUrlMobile": "https://github.com/${REPO}/releases/download/${TAG}/FNTV_mobile_release_v${VERSION}.apk",
            "changelog": "See GitHub Release notes: https://github.com/${REPO}/releases/tag/${TAG}",
            "forceUpdate": false
          }
          EOF
          cat release-assets/update.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FN TV ${{ steps.version.outputs.versionName }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
