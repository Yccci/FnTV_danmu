name: Android CI

on:
  push:
    branches:
      - master
      - 'cursor/**'
  pull_request:
    branches:
      - master

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build TV & Mobile Release APKs
        run: ./gradlew assembleTvRelease assembleMobileRelease --no-daemon --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fntv-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/tv/release/*.apk
            app/build/outputs/apk/mobile/release/*.apk
          if-no-files-found: error
          retention-days: 14
